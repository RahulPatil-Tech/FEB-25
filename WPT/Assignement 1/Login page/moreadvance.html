<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Rapa Labs</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>
/* --------------  VARIABLES & RESET -------------- */
:root{
  --brand:#007bff;      --brand-dark:#0056b3;
  --bg-grad1:#74ebd5;   --bg-grad2:#ACB6E5;
  --card-bg:hsla(0,0%,100%,.85);
  --card-border:hsla(0,0%,100%,.35);
  --shadow:rgba(0,0,0,.15);  --blur:16px;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",Helvetica,Arial,sans-serif}

/* --------------  BACKGROUND -------------- */
body{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--bg-grad1),var(--bg-grad2));overflow:hidden;
}
body::before{
  content:"";position:absolute;inset:0;z-index:-1;
  background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" fill="white" opacity="0.15"><circle cx="100" cy="1100" r="100"/><circle cx="1150" cy="200" r="130"/><circle cx="350" cy="400" r="80"/><circle cx="900" cy="950" r="90"/></svg>') center/cover;
  animation:drift 20s linear infinite alternate;
}
@keyframes drift{to{transform:translateY(-80px)}}

/* --------------  CARD SHELL -------------- */
.card{
  width:min(95vw,460px);padding:46px 42px;border-radius:24px;
  background:var(--card-bg);border:1px solid var(--card-border);
  box-shadow:0 12px 28px var(--shadow);backdrop-filter:blur(var(--blur));
  animation:pop .6s cubic-bezier(.25,1.25,.5,1);
}
@keyframes pop{0%{transform:scale(.85) translateY(15px);opacity:0}80%{opacity:1}100%{transform:scale(1)}}

/* --------------  TABS -------------- */
.tabs{display:flex;justify-content:center;margin-bottom:28px}
.tab{
  padding:10px 24px;font-weight:600;cursor:pointer;
  border-radius:24px;transition:.25s;font-size:1rem;color:#222;
}
.tab.active{background:var(--brand);color:white;box-shadow:0 4px 12px var(--shadow)}

/* --------------  COMMON FORM STYLES -------------- */
form{display:flex;flex-direction:column;gap:26px}
.group{position:relative}
input{
  width:100%;padding:18px 50px 18px 18px;border-radius:14px;
  border:1px solid #ccc;font-size:1rem;
  background:hsla(0,0%,100%,.55);transition:border .25s,box-shadow .25s;
}
input:focus{outline:none;border:1px solid var(--brand);
            box-shadow:0 0 0 4px rgba(0,123,255,.15)}
label.floating{
  position:absolute;left:18px;top:50%;transform:translateY(-50%);
  pointer-events:none;color:#777;transition:.25s;font-size:1rem;
}
input:focus+label.floating,
input:not(:placeholder-shown)+label.floating{
  top:-8px;background:var(--card-bg);padding:0 6px;font-size:.75rem;
  color:var(--brand);border-radius:4px;
}
.group i.icon{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:#999;cursor:pointer}

/* --------------  REMEMBER / T&C -------------- */
.row{display:flex;align-items:center;gap:10px;font-size:.88rem;color:#444}
.row input{margin:0}
.row a{color:var(--brand);text-decoration:none}
.row a:hover{text-decoration:underline}

/* --------------  SUBMIT BUTTON -------------- */
button.submit{
  background:var(--brand);color:#fff;font-size:1.1rem;font-weight:600;
  padding:15px;border:none;border-radius:14px;cursor:pointer;transition:.25s;
}
button.submit:hover{background:var(--brand-dark);transform:translateY(-2px)}
button.submit:active{transform:translateY(0)}

/* --------------  FOOTER LINKS -------------- */
.foot{text-align:center;font-size:.9rem;margin-top:25px;color:#555}
.foot a{color:inherit;margin:0 6px;text-decoration:none}
.foot a:hover{color:var(--brand)}

/* --------------  VISIBILITY HANDLING -------------- */
.auth-pane{display:none;animation:fade .3s}
.auth-pane.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:340px){.card{padding:39px 24px}}
</style>
</head>
<body>

<div class="card">
  <!-- Tabs -->
  <div class="tabs">
    <span class="tab active" data-target="loginPane">Login</span>
    <span class="tab" data-target="regPane">Register</span>
  </div>

  <!-- ------------ LOGIN PANE ------------ -->
  <section id="loginPane" class="auth-pane active">
    <form action="/login" method="post">
      <div class="group">
        <input type="text" id="loginUser" name="username" placeholder=" " required autocomplete="username">
        <label for="loginUser" class="floating">Username</label>
        <i class="fa fa-user icon"></i>
      </div>

      <div class="group">
        <input type="password" id="loginPass" name="password" placeholder=" " required autocomplete="current-password">
        <label for="loginPass" class="floating">Password</label>
        <i class="fa fa-eye icon" id="toggleLogin"></i>
      </div>

      <div class="row">
        <input type="checkbox" id="remember" name="remember">
        <label for="remember">Remember me</label>
      </div>

      <button class="submit" type="submit">Log In</button>
    </form>

    <p class="foot" style="margin-top:18px">
      <a href="forgot_password.html">Forgot Password?</a>
    </p>
  </section>

  <!-- ------------ REGISTER PANE ------------ -->
  <section id="regPane" class="auth-pane">
    <form action="/register" method="post">
      <div class="group">
        <input type="text" id="regUser" name="username" placeholder=" " required>
        <label for="regUser" class="floating">Username</label>
        <i class="fa fa-user icon"></i>
      </div>

      <div class="group">
        <input type="email" id="regEmail" name="email" placeholder=" " required>
        <label for="regEmail" class="floating">Email</label>
        <i class="fa fa-envelope icon"></i>
      </div>

      <div class="group">
        <input type="password" id="regPass" name="password" placeholder=" " required>
        <label for="regPass" class="floating">Password</label>
        <i class="fa fa-eye icon" id="toggleReg"></i>
      </div>

      <div class="row">
        <input type="checkbox" id="terms" required>
        <label for="terms">I agree to the <a href="terms.html">Terms &amp; Conditions</a></label>
      </div>

      <button class="submit" type="submit">Create Account</button>
    </form>
  </section>

  <!-- Footer links shown on both panes -->
  <div class="foot">
    <a href="privacy.html">Privacy Policy</a> |
    <a href="contact.html">Contact Us</a>
  </div>
</div>

<script>
// --- tab switching ---
document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    // panes
    document.querySelectorAll('.auth-pane').forEach(p=>p.classList.remove('active'));
    document.getElementById(tab.dataset.target).classList.add('active');
  });
});

// --- password visibility toggles ---
function addToggle(btnId,inputId){
  const btn=document.getElementById(btnId), inp=document.getElementById(inputId);
  btn.addEventListener('click',e=>{
    inp.type = inp.type==='password' ? 'text' : 'password';
    e.target.classList.toggle('fa-eye-slash');
  });
}
addToggle('toggleLogin','loginPass');
addToggle('toggleReg','regPass');
</script>
</body>
</html>
