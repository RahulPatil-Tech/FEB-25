<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Student Registration</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>
/* --------------  THEME  -------------- */
:root{
  --brand:#007bff;     
  --brand-dark:#0056b3;
  --bg:#f4f7fb;        
  --field:#fff;         
  --border:#d7e1ed;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",Helvetica,Arial,sans-serif}

/* --------------  LAYOUT -------------- */
body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--bg);
  padding:20px;
}
.card{
  width:min(100%,520px);padding:40px 38px;
  border-radius:18px;
  background:var(--field);
  border:1px solid var(--border);box-shadow:0 8px 26px rgba(0,0,0,.08);
}

/* --------------  TITLE -------------- */
h2{text-align:center;margin-bottom:26px;font-size:1.8rem;color:#222;font-weight:700}

/* --------------  FORM GRID -------------- */
form{
    display:grid;
    gap:20px
}
@media(min-width:600px){
  form{
    grid-template-columns:1fr 1fr;
    column-gap:24px}
  form .full{
    grid-column:1/3
}
}

/* --------------  LABEL + INPUT -------------- */
label{
    display:block;
    font-size:.9rem;
    color:#333;
    margin-bottom:6px}
input,select{
  width:100%;padding:12px;border:1px solid var(--border);
  border-radius:8px;font-size:1rem;background:var(--field);
  transition:border-color .25s,box-shadow .25s}
input:focus,select:focus{
  outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(0,123,255,.15)
}

/* --------------  FILE FIELD -------------- */
input[type="file"]{padding:8px}
input[type="file"]::-webkit-file-upload-button{
  background:var(--brand);border:none;border-radius:6px;color:#fff;padding:8px 14px;
  cursor:pointer;font-weight:600;transition:.25s}
input[type="file"]::-webkit-file-upload-button:hover{background:var(--brand-dark)}

/* --------------  SUBMIT -------------- */
button{
  grid-column:1/3;margin-top:8px;padding:14px;border:none;border-radius:10px;
  background:var(--brand);color:#fff;font-size:1.05rem;font-weight:600;
  cursor:pointer;transition:.25s}
button:hover{background:var(--brand-dark);transform:translateY(-2px)}
button:active{transform:translateY(0)}

.small{text-align:center;font-size:.85rem;color:#555;margin-top:18px}
.small a{color:var(--brand);text-decoration:none}
.small a:hover{text-decoration:underline}
</style>
</head>
<body>

<div class="card">
  <h2>Student Registration</h2>

  <form action="/student-register" method="post" enctype="multipart/form-data">
    <!-- First & Last Name -->
    <div>
      <label for="fname">First Name</label>
      <input type="text" id="fname" name="first_name" required>
    </div>
    <div>
      <label for="lname">Last Name</label>
      <input type="text" id="lname" name="last_name" required>
    </div>

    <!-- Email & Phone -->
    <div>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
    </div>
    <div>
      <label for="phone">Phone</label>
      <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="10‑digit" required>
    </div>

    <!-- Gender & Program -->
    <div>
      <label for="gender">Gender</label>
      <select id="gender" name="gender" required>
        <option value="" disabled selected>Select gender</option>
        <option>Male</option><option>Female</option><option>Other</option>
      </select>
    </div>
    <div>
      <label for="program">Program</label>
      <select id="program" name="program" required>
        <option value="" disabled selected>Select program</option>
        <option>B.Tech</option><option>B.Sc</option><option>B.A</option>
        <option>M.Tech</option><option>M.Sc</option><option>MBA</option>
      </select>
    </div>

    <!-- Year & Photo (span full width on mobile) -->
    <div>
      <label for="year">Year / Semester</label>
      <select id="year" name="year" required>
        <option value="" disabled selected>Select year</option>
        <option>1</option><option>2</option><option>3</option><option>4</option>
      </select>
    </div>
    <div>
      <label for="photo">Profile Photo (optional)</label>
      <input type="file" id="photo" name="photo" accept="image/*">
    </div>

    <!-- Address (full‑width textarea) -->
    <div class="full">
      <label for="address">Address</label>
      <input type="text" id="address" name="address" placeholder="Street, City, State, ZIP" required>
    </div>

    <!-- Submit button spans full grid -->
    <button type="submit">Submit Registration</button>
  </form>

  <p class="small">Already registered? <a href="index.html">Log in</a></p>
</div>

</body>
</html>
